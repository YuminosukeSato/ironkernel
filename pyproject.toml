[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "parsec"
version = "0.1.0"
description = "A Python parallel compute library backed by a Rust execution engine"
requires-python = ">=3.9"
license = "MIT"
dependencies = ["numpy>=1.24"]

[tool.uv]
dev-dependencies = ["maturin>=1.0,<2.0", "pytest>=7.0", "ruff>=0.4", "mypy>=1.0"]

[tool.maturin]
features = ["pyo3/extension-module"]
python-source = "python"
module-name = "parsec._parsec"

[tool.ruff]
target-version = "py39"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.9"
strict = true
warn_return_any = true
warn_unused_configs = true
