[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "ironkernel"
version = "1.0.0"
description = "A Python parallel compute library backed by a Rust execution engine"
requires-python = ">=3.9"
license = "MIT"
dependencies = ["numpy>=1.24"]

[tool.uv]
dev-dependencies = [
    "coverage>=7.0",
    "maturin>=1.0,<2.0",
    "mypy>=1.0",
    "pytest>=7.0",
    "ruff>=0.4",
]

[tool.maturin]
features = ["extension-module"]
python-source = "python"
module-name = "ironkernel._ironkernel"

[tool.ruff]
target-version = "py39"
line-length = 120

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "UP",
    "B",
    "SIM",
    "RUF",
    "PT",
    "C4",
    "PIE",
    "RET",
]
ignore = ["RET504"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pytest.ini_options]
testpaths = ["tests/python"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.9"
strict = true
warn_return_any = true
warn_unused_configs = true
